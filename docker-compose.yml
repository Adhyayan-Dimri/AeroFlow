services:
  mongodb:
    image: mongo:7.0
    container_name: aeroflow-mongodb
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=aeroflow
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - aeroflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aeroflow-backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=aeroflow
      - JWT_SECRET=aeroflow-production-secret-replace-with-64-char-hex
      - ENCRYPTION_KEY=dGhpcy1pcy1hLTMyLWJ5dGUtZW5jcnlwdGlvbi1rZXk=
      - ADMIN_EMAIL=admin@aeroflow.local
      - ADMIN_PASSWORD=admin123
      - FRONTEND_URL=http://localhost:3000
      - MODE_CUTOFF_HOURS=2
      - EMAIL_FROM_NAME=AeroFlow Operations
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aeroflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=http://localhost:8001
    container_name: aeroflow-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 20s
      timeout: 5s
      retries: 3
    networks:
      - aeroflow-net

networks:
  aeroflow-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
